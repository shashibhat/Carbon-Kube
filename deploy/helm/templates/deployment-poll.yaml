{{- if .Values.poller.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: carbon-kube-poller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: carbon-kube-poller
  template:
    metadata:
      labels:
        app: carbon-kube-poller
    spec:
      serviceAccountName: carbon-kube-poller
      containers:
        - name: poller
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          args: ["poll"]
          env:
            - name: POLL_INTERVAL_SECONDS
              value: "{{ .Values.poller.intervalSeconds }}"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ELECTRICITYMAPS_ZONES
              value: "{{ join "," .Values.poller.electricityMaps.zones }}"
            - name: ELECTRICITYMAPS_BASE_URL
              value: "{{ .Values.poller.electricityMaps.baseUrl }}"
            {{- if .Values.poller.electricityMaps.apiKey }}
            - name: ELECTRICITYMAPS_API_KEY
              value: "{{ .Values.poller.electricityMaps.apiKey }}"
            {{- end }}
            {{- if .Values.poller.electricityMaps.secretName }}
            - name: ELECTRICITYMAPS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: "{{ .Values.poller.electricityMaps.secretName }}"
                  key: "{{ .Values.poller.electricityMaps.secretKey }}"
            {{- end }}
{{- end }}
