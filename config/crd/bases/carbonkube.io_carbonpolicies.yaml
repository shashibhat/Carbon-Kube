apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: carbonpolicies.carbonkube.io
spec:
  group: carbonkube.io
  scope: Namespaced
  names:
    plural: carbonpolicies
    singular: carbonpolicy
    kind: CarbonPolicy
    shortNames:
      - cpolicy
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                objectives:
                  type: object
                  properties:
                    carbonWeight:
                      type: number
                    costWeight:
                      type: number
                    slaRiskWeight:
                      type: number
                    dataGravityWeight:
                      type: number
                  required:
                    - carbonWeight
                    - costWeight
                    - slaRiskWeight
                    - dataGravityWeight
                constraints:
                  type: object
                  properties:
                    maxSLAIncreasePercent:
                      type: integer
                    maxExtraLatencyMs:
                      type: integer
                    maxCarbonPerDay:
                      type: integer
                    maxCarbonPerJob:
                      type: integer
                  required:
                    - maxSLAIncreasePercent
                    - maxExtraLatencyMs
                shifting:
                  type: object
                  properties:
                    allowTemporalShifting:
                      type: boolean
                    maxDelay:
                      type: string
                    minGreenWindow:
                      type: string
                  required:
                    - allowTemporalShifting
                spatial:
                  type: object
                  properties:
                    allowedRegions:
                      type: array
                      items:
                        type: string
                    avoidRegions:
                      type: array
                      items:
                        type: string
                    carbonThresholds:
                      type: object
                      properties:
                        highCarbonLimit:
                          type: integer
                        extremeCarbonLimit:
                          type: integer
                      required:
                        - highCarbonLimit
                        - extremeCarbonLimit
                  required:
                    - carbonThresholds
                adaptive:
                  type: object
                  properties:
                    enableAutoTune:
                      type: boolean
                    learningRate:
                      type: number
                    explorationRate:
                      type: number
                    targetCarbonReductionPercent:
                      type: integer
                  required:
                    - enableAutoTune
              required:
                - objectives
                - constraints
                - spatial
            status:
              type: object
              properties:
                normalizedWeights:
                  type: object
                  additionalProperties:
                    type: number
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
