apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: carbonjobs.carbonkube.io
spec:
  group: carbonkube.io
  scope: Namespaced
  names:
    plural: carbonjobs
    singular: carbonjob
    kind: CarbonJobSpec
    shortNames:
      - cjob
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                jobType:
                  type: string
                  enum:
                    - batch
                    - streaming
                    - online
                carbonPolicyRef:
                  type: string
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    gpu:
                      type: string
                dataAffinity:
                  type: object
                  properties:
                    primaryRegion:
                      type: string
                    allowedRegions:
                      type: array
                      items:
                        type: string
                    kafkaTopics:
                      type: array
                      items:
                        type: string
                    kafkaRegion:
                      type: string
                    objectStores:
                      type: array
                      items:
                        type: string
                    dbRegion:
                      type: string
                    maxExtraLatencyMs:
                      type: integer
                mobility:
                  type: object
                  properties:
                    level:
                      type: string
                      enum:
                        - pinned
                        - constrained
                        - highly-mobile
                    reasons:
                      type: array
                      items:
                        type: string
                temporal:
                  type: object
                  properties:
                    allowDelay:
                      type: boolean
                    maxDelay:
                      type: string
                    requireGreenWindow:
                      type: string
                budgets:
                  type: object
                  properties:
                    maxCarbonForThisRun:
                      type: integer
                    desiredCarbonReduction:
                      type: number
                      minimum: 0
                      maximum: 1
              required:
                - jobType
                - carbonPolicyRef
            status:
              type: object
              properties:
                dataGravityScore:
                  type: number
                mobilityScore:
                  type: number
                slaRiskScore:
                  type: number
                placementHint:
                  type: object
                  properties:
                    region:
                      type: string
                    carbonPriorityScore:
                      type: number
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
