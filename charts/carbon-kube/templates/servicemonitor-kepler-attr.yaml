{{- if and .Values.monitoring.enabled .Values.monitoring.prometheus.serviceMonitor.enabled .Values.keplerAttr.enabled -}}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: carbon-kube-kepler-attr
  namespace: {{ .Values.monitoring.prometheus.serviceMonitor.namespace | default .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: carbon-kube-kepler-attr
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.prometheus.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.prometheus.serviceMonitor.scrapeTimeout }}
      path: /metrics
      scheme: http
{{- end }}
