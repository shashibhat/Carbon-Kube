{{- if .Values.keplerAttr.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: carbon-kube-kepler-attr
  namespace: {{ .Release.Namespace }}
  labels:
    app: carbon-kube-kepler-attr
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: metrics
  selector:
    app: carbon-kube-kepler-attr
{{- end }}
