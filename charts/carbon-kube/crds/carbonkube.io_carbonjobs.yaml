apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: carbonjobs.carbonkube.io
spec:
  group: carbonkube.io
  scope: Namespaced
  names:
    plural: carbonjobs
    singular: carbonjob
    kind: CarbonJobSpec
    shortNames:
      - cjob
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              properties:
                dagId:
                  type: string
                stageId:
                  type: string
                upstreamStages:
                  type: array
                  items:
                    type: string
                mobilityLevel:
                  type: string
                  enum:
                    - pinned
                    - constrained
                    - highly-mobile
                estimatedRuntimeSeconds:
                  type: integer
                  minimum: 0
                estimatedCpuSeconds:
                  type: integer
                  minimum: 0
                deadline:
                  type: string
                  format: date-time
                dataSources:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - kafka
                          - db
                          - s3
                      resource:
                        type: string
                      region:
                        type: string
                      avgIngressGBPerJob:
                        type: number
                      avgReadGBPerJob:
                        type: number
                policyRef:
                  type: string
              required:
                - dagId
                - stageId
                - estimatedRuntimeSeconds
            status:
              type: object
              properties:
                dag:
                  type: object
                  properties:
                    isCriticalPath:
                      type: boolean
                    topoDepth:
                      type: integer
                    normalizedImportance:
                      type: number
                lastUpdated:
                  type: string
                  format: date-time
      subresources:
        status: {}
