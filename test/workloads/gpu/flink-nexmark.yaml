apiVersion: v1
kind: ConfigMap
metadata:
  name: flink-nexmark-config
  namespace: carbon-kube
data:
  flink-conf.yaml: |
    jobmanager.rpc.address: flink-nexmark-jobmanager
    taskmanager.numberOfTaskSlots: 4
    parallelism.default: 4
    jobmanager.memory.process.size: 2048m
    taskmanager.memory.process.size: 8192m
    taskmanager.memory.flink.size: 6144m
    state.backend: rocksdb
    state.checkpoints.dir: file:///tmp/flink-checkpoints
    state.savepoints.dir: file:///tmp/flink-savepoints
    execution.checkpointing.interval: 60000
    execution.checkpointing.mode: EXACTLY_ONCE
    restart-strategy: fixed-delay
    restart-strategy.fixed-delay.attempts: 3
    restart-strategy.fixed-delay.delay: 10s
    # GPU-specific configurations
    taskmanager.gpu.enabled: true
    taskmanager.gpu.memory.size: 8g
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-nexmark-jobmanager
  namespace: carbon-kube
  labels:
    app: flink-nexmark
    component: jobmanager
    workload-type: streaming
    carbon-aware: "true"
    evaluation: "gpu-carbon"
  annotations:
    carbon-kube.io/qos-profile: "production-optimized"
    carbon-kube.io/migration-policy: "stateful"
    carbon-kube.io/carbon-priority: "medium"
    carbon-kube.io/sla-class: "production"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flink-nexmark
      component: jobmanager
  template:
    metadata:
      labels:
        app: flink-nexmark
        component: jobmanager
        workload-type: streaming
        carbon-aware: "true"
    spec:
      schedulerName: carbon-kube-scheduler
      containers:
      - name: jobmanager
        image: flink:1.18.0-scala_2.12-java11
        args: ["jobmanager"]
        ports:
        - containerPort: 6123
          name: rpc
        - containerPort: 6124
          name: blob-server
        - containerPort: 8081
          name: webui
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-nexmark-jobmanager
            blob.server.port: 6124
            query.server.port: 6125
        resources:
          requests:
            cpu: "1"
            memory: "2Gi"
          limits:
            cpu: "2"
            memory: "4Gi"
        volumeMounts:
        - name: flink-config-volume
          mountPath: /opt/flink/conf
        - name: tmp-storage
          mountPath: /tmp
      volumes:
      - name: flink-config-volume
        configMap:
          name: flink-nexmark-config
      - name: tmp-storage
        emptyDir:
          sizeLimit: "5Gi"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flink-nexmark-taskmanager
  namespace: carbon-kube
  labels:
    app: flink-nexmark
    component: taskmanager
    workload-type: streaming
    carbon-aware: "true"
    evaluation: "gpu-carbon"
  annotations:
    carbon-kube.io/qos-profile: "production-optimized"
    carbon-kube.io/migration-policy: "checkpointable"
    carbon-kube.io/carbon-priority: "medium"
    carbon-kube.io/sla-class: "production"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flink-nexmark
      component: taskmanager
  template:
    metadata:
      labels:
        app: flink-nexmark
        component: taskmanager
        workload-type: streaming
        carbon-aware: "true"
      annotations:
        carbon-kube.io/checkpoint-interval: "60s"
        carbon-kube.io/max-migration-time: "120s"
    spec:
      schedulerName: carbon-kube-scheduler
      nodeSelector:
        node.kubernetes.io/instance-type: "p4d.24xlarge"
        carbon-kube.io/gpu-enabled: "true"
      tolerations:
      - key: "nvidia.com/gpu"
        operator: "Exists"
        effect: "NoSchedule"
      - key: "carbon-kube.io/gpu-workload"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      containers:
      - name: taskmanager
        image: flink:1.18.0-scala_2.12-java11
        args: ["taskmanager"]
        ports:
        - containerPort: 6122
          name: rpc
        - containerPort: 6125
          name: query-state
        env:
        - name: FLINK_PROPERTIES
          value: |
            jobmanager.rpc.address: flink-nexmark-jobmanager
            taskmanager.rpc.port: 6122
            taskmanager.numberOfTaskSlots: 4
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        resources:
          requests:
            nvidia.com/gpu: "1"
            cpu: "4"
            memory: "8Gi"
            ephemeral-storage: "20Gi"
          limits:
            nvidia.com/gpu: "1"
            cpu: "8"
            memory: "16Gi"
            ephemeral-storage: "50Gi"
        volumeMounts:
        - name: flink-config-volume
          mountPath: /opt/flink/conf
        - name: tmp-storage
          mountPath: /tmp
        - name: shm
          mountPath: /dev/shm
      volumes:
      - name: flink-config-volume
        configMap:
          name: flink-nexmark-config
      - name: tmp-storage
        emptyDir:
          sizeLimit: "10Gi"
      - name: shm
        emptyDir:
          medium: Memory
          sizeLimit: "4Gi"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: flink-nexmark-benchmark
  namespace: carbon-kube
  labels:
    app: flink-nexmark
    component: benchmark
    workload-type: streaming
    carbon-aware: "true"
    evaluation: "gpu-carbon"
  annotations:
    carbon-kube.io/qos-profile: "batch-optimized"
    carbon-kube.io/migration-policy: "checkpointable"
    carbon-kube.io/carbon-priority: "low"
    carbon-kube.io/sla-class: "batch"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 2
  template:
    metadata:
      labels:
        app: flink-nexmark
        component: benchmark
        workload-type: streaming
        carbon-aware: "true"
    spec:
      schedulerName: carbon-kube-scheduler
      restartPolicy: Never
      initContainers:
      - name: wait-for-flink
        image: busybox:1.35
        command:
        - sh
        - -c
        - |
          echo "Waiting for Flink JobManager to be ready..."
          until nc -z flink-nexmark-jobmanager 8081; do
            echo "Waiting for JobManager..."
            sleep 5
          done
          echo "JobManager is ready!"
      containers:
      - name: nexmark-benchmark
        image: python:3.9-slim
        command:
        - python
        - -c
        - |
          import requests
          import json
          import time
          import random
          import threading
          from datetime import datetime, timedelta
          
          class NexMarkBenchmark:
              def __init__(self):
                  self.jobmanager_url = "http://flink-nexmark-jobmanager:8081"
                  self.job_id = None
                  
              def submit_nexmark_job(self):
                  """Submit a NexMark-like streaming job to Flink"""
                  
                  # Simplified NexMark-like job definition
                  job_definition = {
                      "entryClass": "org.apache.flink.streaming.examples.windowing.WindowWordCount",
                      "programArgs": "--input /tmp/nexmark-data --output /tmp/nexmark-results",
                      "parallelism": 4,
                      "savepointPath": None
                  }
                  
                  # For this evaluation, we'll simulate the job submission
                  print("Submitting NexMark-like streaming job...")
                  
                  # Generate synthetic auction data (NexMark Query 1 equivalent)
                  self.generate_auction_data()
                  
                  # Simulate continuous streaming processing
                  self.run_streaming_queries()
                  
              def generate_auction_data(self):
                  """Generate synthetic auction data similar to NexMark"""
                  print("Generating synthetic auction data for GPU processing...")
                  
                  # Simulate data generation for 30 minutes
                  end_time = time.time() + 1800  # 30 minutes
                  event_count = 0
                  
                  while time.time() < end_time:
                      # Generate batch of events
                      batch_size = random.randint(100, 1000)
                      
                      for i in range(batch_size):
                          # Simulate auction event
                          event = {
                              "id": event_count,
                              "itemName": f"item_{random.randint(1, 10000)}",
                              "description": f"Description for item {event_count}",
                              "initialBid": random.randint(1, 1000),
                              "reserve": random.randint(50, 2000),
                              "dateTime": datetime.now().isoformat(),
                              "expires": (datetime.now() + timedelta(hours=1)).isoformat(),
                              "seller": random.randint(1, 1000),
                              "category": random.randint(1, 50)
                          }
                          event_count += 1
                      
                      # Log progress every 10000 events
                      if event_count % 10000 == 0:
                          print(f"Generated {event_count} auction events")
                      
                      # Simulate processing time
                      time.sleep(0.1)
                  
                  print(f"Completed data generation: {event_count} total events")
                  
              def run_streaming_queries(self):
                  """Run NexMark-like streaming queries"""
                  print("Running NexMark-like streaming queries...")
                  
                  queries = [
                      "Query 1: Currency Conversion",
                      "Query 2: Selection", 
                      "Query 3: Local Item Suggestion",
                      "Query 4: Average Price for Category",
                      "Query 5: Hot Items"
                  ]
                  
                  # Run each query simulation
                  for query in queries:
                      print(f"Executing {query}...")
                      start_time = time.time()
                      
                      # Simulate query processing with GPU acceleration
                      self.simulate_gpu_query_processing(query)
                      
                      duration = time.time() - start_time
                      print(f"{query} completed in {duration:.2f}s")
                  
              def simulate_gpu_query_processing(self, query_name):
                  """Simulate GPU-accelerated query processing"""
                  
                  # Simulate different processing patterns for different queries
                  if "Currency" in query_name:
                      # Simple transformation - fast
                      time.sleep(random.uniform(2, 5))
                  elif "Selection" in query_name:
                      # Filtering operation - medium
                      time.sleep(random.uniform(5, 10))
                  elif "Suggestion" in query_name:
                      # Complex join-like operation - slower
                      time.sleep(random.uniform(10, 20))
                  elif "Average" in query_name:
                      # Aggregation - medium
                      time.sleep(random.uniform(8, 15))
                  elif "Hot Items" in query_name:
                      # Windowed aggregation - complex
                      time.sleep(random.uniform(15, 30))
                  
                  # Simulate GPU memory usage patterns
                  print(f"  GPU processing for {query_name}: simulating memory-intensive operations")
                  
              def monitor_job(self):
                  """Monitor job execution and collect metrics"""
                  print("Monitoring Flink NexMark job execution...")
                  
                  start_time = time.time()
                  duration = 1800  # 30 minutes
                  
                  while time.time() - start_time < duration:
                      try:
                          # Check JobManager status
                          response = requests.get(f"{self.jobmanager_url}/overview", timeout=5)
                          if response.status_code == 200:
                              overview = response.json()
                              print(f"Flink cluster status: {overview.get('flink-version', 'unknown')}")
                          
                          # Simulate metrics collection
                          elapsed = time.time() - start_time
                          progress = (elapsed / duration) * 100
                          print(f"Job progress: {progress:.1f}% ({elapsed:.0f}s elapsed)")
                          
                      except Exception as e:
                          print(f"Monitoring error: {e}")
                      
                      time.sleep(30)  # Check every 30 seconds
                  
                  print("Job monitoring completed")
                  
              def run_benchmark(self):
                  """Run the complete NexMark benchmark"""
                  print("Starting Flink NexMark GPU carbon evaluation...")
                  
                  # Start monitoring in background
                  monitor_thread = threading.Thread(target=self.monitor_job)
                  monitor_thread.daemon = True
                  monitor_thread.start()
                  
                  # Submit and run the job
                  self.submit_nexmark_job()
                  
                  print("Flink NexMark GPU evaluation completed successfully!")
          
          # Run the benchmark
          benchmark = NexMarkBenchmark()
          benchmark.run_benchmark()
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
        volumeMounts:
        - name: tmp-storage
          mountPath: /tmp
      volumes:
      - name: tmp-storage
        emptyDir:
          sizeLimit: "5Gi"
---
