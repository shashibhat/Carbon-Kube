kind: Service
metadata:
  name: flink-nexmark-taskmanager
  namespace: carbon-kube
  labels:
    app: flink-nexmark
    component: taskmanager
spec:
  type: ClusterIP
  ports:
  - name: rpc
    port: 6122
    targetPort: 6122
